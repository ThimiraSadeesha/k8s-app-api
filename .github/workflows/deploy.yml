name: build-and-deploy
on:
  push:
    branches: [dev, main]

env:
  IMAGE_NAME: k8s-app-api
  OWNER: thimirasadeesha
  CONFIG_REPO: ThimiraSadeesha/k8s-config

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
    - uses: actions/checkout@v4
    - id: meta
      run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ env.CONFIG_REPO }}
        token: ${{ secrets.CONFIG_REPO_TOKEN }}
    - name: Pick target
      run: |
        if [ "${GITHUB_REF_NAME}" = "main" ]; then
          echo "OVERLAY=prod" >> "$GITHUB_ENV"
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
        else
          echo "OVERLAY=dev" >> "$GITHUB_ENV"
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
        fi
        echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
    - name: Set image tag and apply
      working-directory: config/overlays/${{ env.OVERLAY }}
      run: |
        kustomize edit set image ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}=ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}
        kubectl apply -k .
        kubectl rollout status deploy/${{ env.IMAGE_NAME }} -n ${{ env.OVERLAY }} --timeout=180s
    - name: Record deployed tag in config repo
      run: |
        git config user.name ci && git config user.email ci@users.noreply.github.com
        git commit -am "deploy ${{ env.IMAGE_NAME }} ${{ needs.build.outputs.tag }} to ${{ env.OVERLAY }}" || true
        git push || true
