name: build-and-deploy
on:
  push:
    branches: [dev, main]

env:
  IMAGE_NAME: k8s-app-api
  OWNER: thimirasadeesha
  CONFIG_REPO: ThimiraSadeesha/k8s-config


concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
    - uses: actions/checkout@v4
    - id: meta
      run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      OVERLAY: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      KUBE_CONFIG_B64: ${{ github.ref_name == 'main' && secrets.KUBE_CONFIG_PROD || secrets.KUBE_CONFIG_DEV }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ env.CONFIG_REPO }}
        token: ${{ secrets.CONFIG_REPO_TOKEN }}

    # k8s-config is the source of truth: record the new tag there first, so the repo never
    # lags behind the cluster. Retries cover another repo pushing at the same moment.
    - name: Record image tag in k8s-config
      run: |
        f=config/overlays/$OVERLAY/kustomization.yaml
        sed -i -E "s#(name: ghcr\.io/$OWNER/$IMAGE_NAME, newTag: ).*#\1\"$TAG\" }#" "$f"
        grep -q "name: ghcr.io/$OWNER/$IMAGE_NAME, newTag: \"$TAG\" }" "$f" || { echo "image entry for $IMAGE_NAME not found in $f"; exit 1; }
        git config user.name "ci"
        git config user.email "ci@users.noreply.github.com"
        git diff --quiet || git commit -am "deploy $IMAGE_NAME $TAG to $OVERLAY"
        pushed=false
        for i in 1 2 3 4; do
          if git pull --rebase origin main && git push origin HEAD:main; then pushed=true; break; fi
          sleep $((i * 3))
        done
        $pushed

    - name: Apply to the cluster
      run: |
        test -n "$KUBE_CONFIG_B64" || { echo "kubeconfig secret for $OVERLAY is not set"; exit 1; }
        mkdir -p ~/.kube
        echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
        kubectl apply -k config/overlays/$OVERLAY
        kubectl rollout status deploy/$IMAGE_NAME -n $OVERLAY --timeout=180s
